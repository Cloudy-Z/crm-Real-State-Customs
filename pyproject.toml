[project]
name = "real_estate_crm_customs"
authors = [
    { name = "Cloudy-Z", email = "admin@example.com" }
]
description = "Isolated Frappe custom app for real estate CRM customizations"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
crm = ">=2.0.0-dev"

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["real_estate_crm_customs"]

[tool.black]
line-length = 110
